<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dirt Cycles | Shop Mountain Bikes</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="index.html">
        <img src="static/img/logo-dirt-cycles.svg" alt="Dirt Cycles logo" />
        <span>Dirt Cycles</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">Guide</a>
        <a href="shop.html" aria-current="page">Shop Bikes</a>
      </nav>
    <a href="cart.html" class="cart-chip" aria-label="View cart">
        🛒 <span id="cartCount">0</span>
    </a>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero">
      <h1>Shop Mountain Bikes</h1>
      <p class="lead">Browse by discipline, wheel size, travel and price. Add to cart to build your dream rig.</p>
    </section>

    <section class="section card">
      <h2>Filters</h2>
      <div class="product-controls">
        <div class="field">
          <label for="filterCategory">Discipline</label>
          <select id="filterCategory">
            <option value="">All</option>
            <option value="XC">XC</option>
            <option value="Trail">Trail</option>
            <option value="Enduro">Enduro</option>
            <option value="DH">Downhill</option>
            <option value="DJ">Dirt Jump</option>
            <option value="e-MTB">e‑MTB</option>
          </select>
        </div>

        <div class="field">
          <label for="filterWheel">Wheel Size</label>
          <select id="filterWheel">
            <option value="">All</option>
            <option value="29">29"</option>
            <option value="27.5">27.5"</option>
            <option value="Mullet">Mullet</option>
          </select>
        </div>

        <div class="field">
          <label for="filterMaxPrice">Max Price (£)</label>
          <input id="filterMaxPrice" type="number" min="0" step="50" placeholder="e.g. 3500" />
        </div>

        <div class="field">
          <label for="sortBy">Sort By</label>
          <select id="sortBy">
            <option value="featured">Featured</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
            <option value="weight-asc">Weight ↑</option>
            <option value="weight-desc">Weight ↓</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="applyFilters">Apply Filters</button>
        <button id="clearFilters" class="ghost">Clear</button>
      </div>

      <div id="productGrid" class="product-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Dirt Cycles — Built to Send.</p>
    </div>
  </footer>

  <script src="static/app.js"></script>
</body>
</html>
