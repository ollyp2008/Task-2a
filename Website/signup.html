<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up – Necessities Direct</title>
  <link rel="stylesheet" href="static/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="static/supabaseClient.js" defer></script>
  <script src="static/auth.js" defer></script>
</head>
<body>
  <header class="nd-header">
    <div class="logo">Necessities Direct</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="tracking.html">Tracking</a>
      <a href="account.html">My Account</a>
      <a href="loyalty.html">Loyalty</a>
      <a href="login.html">Sign In</a>
      <a href="signup.html">Sign Up</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main>
    <section class="auth-page">
      <h1>Create your account</h1>
<form id="signup-form">
  <label>
    Full Name
    <input type="text" id="signup-fullname" required>
  </label>

  <label>
    Phone Number
    <input type="text" id="signup-phone" required>
  </label>

  <label>
    Address Line 1
    <input type="text" id="signup-address1" required>
  </label>

  <label>
    Address Line 2
    <input type="text" id="signup-address2">
  </label>

  <label>
    City
    <input type="text" id="signup-city" required>
  </label>

  <label>
    Postcode
    <input type="text" id="signup-postcode" required>
  </label>

  <label>
    Email Address
    <input type="email" id="signup-email" required>
  </label>

  <label>
    Password
    <input type="password" id="signup-password" required>
  </label>

  <button type="submit">Create Account</button>
</form>

<p id="signup-message"></p>

<p id="signup-message"></p>
      <p id="signup-message"></p>
    </section>
  </main>

  <footer>
    © <span id="year"></span> Necessities Direct. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
