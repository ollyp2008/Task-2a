<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loyalty – Necessities Direct</title>

  <link rel="stylesheet" href="static/style.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="static/supabaseClient.js" defer></script>
  <script src="static/loyalty.js" defer></script>
</head>

<body>

<header class="nd-header">
  <div class="logo">Necessities Direct</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="tracking.html">Tracking</a>
    <a href="loyalty.html">Loyalty</a>
    <a href="account.html">My Account</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>


<main class="loyalty-page">

  <h1>Your Loyalty Rewards</h1>

  <div class="loyalty-box">

    <div class="points-box">
      <h2>Points Balance</h2>
      <p id="points">0</p>
    </div>

    <div class="progress-box">
      <h2>Progress to next reward</h2>

      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>

      <p id="progress-text"></p>

    </div>

    <div class="redeem-box">
      <h2>Redeem Reward</h2>
      <button id="redeem-btn">Redeem 100 Points</button>
      <p id="redeem-msg"></p>
    </div>

  </div>

</main>


<footer>
  © <span id="year"></span> Necessities Direct
</footer>

<script>
document.getElementById("year").textContent =
  new Date().getFullYear();
</script>

</body>
</html>
